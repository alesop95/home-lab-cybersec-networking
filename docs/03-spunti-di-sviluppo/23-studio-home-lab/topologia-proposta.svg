<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Home lab: topologia proposta del 22 settembre 2026</title>
  <desc id="desc">Modem ISP verso firewall OPNsense, switch Zyxel con due access point e un terzo opzionale, client, host sempre acceso e NAS a orario. DMZ su porta fisica separata. VLAN con routing sul firewall. Progetto, non rete collaudata.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: sans-serif; fill: #172b45; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 16px; fill: #52647b; }
      .name { font-size: 18px; font-weight: 700; }
      .label { font-size: 14px; fill: #52647b; }
      .small { font-size: 13px; fill: #52647b; }
      .existing { fill: #e9f6ee; stroke: #4c9770; stroke-width: 2; }
      .planned { fill: #eef4ff; stroke: #4d76b8; stroke-width: 2; }
      .optional { fill: #f6f7fb; stroke: #8b96a8; stroke-width: 2; stroke-dasharray: 7 5; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 5; }
      .zone { fill: #ffffff; stroke: #c5d0df; }
    </style>
  </defs>
